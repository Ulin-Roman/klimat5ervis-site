<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Проверка адаптивности — Климат-Сервис</title><style>*{box-sizing:border-box}body{margin:0;background:#dce3e8;color:#182c37;font:14px/1.5 Arial,sans-serif}header{background:white;display:flex;align-items:center;justify-content:center;gap:18px;padding:14px;flex-wrap:wrap}label{font-size:12px}select,button{padding:8px;border:1px solid #b9cbd5;border-radius:8px;background:white;color:#182c37;font:inherit}a{color:#007d9f}#viewport{overflow:auto;padding:20px;display:flex;justify-content:safe center;align-items:flex-start;min-height:860px}iframe{width:375px;height:812px;border:0;border-radius:18px;background:white;box-shadow:0 5px 40px #182c3720;flex-shrink:0}output{font-size:11px;min-width:200px}</style></head><body><header><a href="index.html">Открыть витрину </a><label>Ширина <select id="width"><option>320</option><option selected>375</option><option>390</option><option>480</option><option>768</option><option>1024</option><option>1280</option><option>1440</option><option>1920</option></select> px</label><label>Страница <select id="route"><option value="home">Главная</option><option value="catalog">Каталог</option><option value="product-7715">Карточка товара</option></select></label><button id="reload">Обновить</button><output id="status" aria-live="polite">Загрузка…</output></header><div id="viewport"><iframe id="shop" title="Тестовая витрина" src="index.html#home"></iframe></div><script>const frame=document.getElementById('shop'),width=document.getElementById('width'),route=document.getElementById('route');function report(){try{const d=frame.contentDocument;document.getElementById('status').textContent='Экран '+d.documentElement.clientWidth+' · Страница '+d.documentElement.scrollWidth+' px'}catch(e){document.getElementById('status').textContent='Открыта внешняя страница'}}width.onchange=()=>{frame.style.width=width.value+'px';requestAnimationFrame(()=>requestAnimationFrame(report))};route.onchange=()=>{frame.src='index.html#'+route.value};frame.onload=report;document.getElementById('reload').onclick=()=>frame.contentWindow.location.reload();</script></body></html>
